<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Werkzeugverwaltung</title>
<style>
:root{
 --bg:#f5f6f8;--surface:#fff;--text:#17202b;--muted:#7a8491;--line:#e8ebef;
 --accent:#111827;--success:#198754;--danger:#c0392b;--shadow:0 2px 14px rgba(20,30,45,.07);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{padding-bottom:82px}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{width:min(100%,720px);margin:auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 16px}
.brand{font-size:25px;font-weight:750;letter-spacing:-.6px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);color:var(--text);font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px 13px;box-shadow:var(--shadow)}
.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.stat b{font-size:24px;line-height:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.action{height:52px;border-radius:15px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(17,24,39,.16)}
.action.light{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow)}
.searchbar{position:relative;margin-bottom:10px}
.searchbar input{height:48px;padding:0 16px 0 44px;border:1px solid var(--line);background:var(--surface);border-radius:15px;box-shadow:var(--shadow);outline:none}
.searchbar:before{content:"⌕";position:absolute;left:16px;top:10px;color:var(--muted);font-size:22px;z-index:1}
.filters{display:flex;gap:7px;margin-bottom:14px;overflow:auto;padding-bottom:2px}
.filter{white-space:nowrap;padding:8px 13px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line);font-size:13px}
.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:9px}
.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);transition:transform .12s}
.tool-card:active{transform:scale(.99)}
.tool-top{display:flex;gap:12px;align-items:center}
.tool-avatar{width:46px;height:46px;border-radius:13px;background:#eef1f5;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.tool-main{min-width:0;flex:1}
.tool-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-meta{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;font-weight:750;padding:6px 8px;border-radius:999px;white-space:nowrap}
.status.ok{background:#e8f7ef;color:#177245}.status.out{background:#fdebea;color:#a52d25}
.tool-bottom{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:11px;padding-top:10px;border-top:1px solid #f0f1f3}
.empty{background:var(--surface);border:1px dashed #d7dce2;border-radius:18px;padding:34px 20px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(12,18,28,.42);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--surface);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet-head h2{font-size:19px;margin:0;flex:1}
.close{width:38px;height:38px;border-radius:12px;background:#f1f3f5;color:#303844}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;color:#4d5865;margin:10px 2px 5px}
input,select,textarea{width:100%;border:1px solid #dfe3e8;border-radius:12px;background:#fff;color:var(--text);padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#9da6b1;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
.form-actions{display:flex;gap:9px;margin-top:16px}
.form-actions button{flex:1;height:48px;border-radius:13px;font-weight:700}
.primary{background:var(--accent);color:#fff}.secondary{background:#f1f3f5;color:var(--text)}
.detail-card{background:#f7f8fa;border-radius:16px;padding:15px;margin-top:10px}
.detail-row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #e8ebef;font-size:13px}
.detail-row:last-child{border-bottom:0}
.detail-label{color:var(--muted)}
.settings-section{margin-top:8px}.settings-section h3{font-size:15px;margin:18px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 10px}
.chip{background:#eef1f5;border-radius:999px;padding:8px 10px;font-size:12px}
.chip button{background:none;padding:0 0 0 5px;color:#7a8491}
.setting-row{display:flex;gap:8px}.setting-row button{padding:0 15px;border-radius:12px;background:var(--accent);color:#fff}
.bottom-nav{position:fixed;z-index:15;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
.nav-item{background:none;color:#7a8491;font-size:11px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav-item.active{color:#111827}.nav-icon{font-size:20px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.app{padding:0 13px}.brand{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🔧 Werkzeugverwaltung</div>
    <button class="icon-btn" onclick="openSettings()" aria-label="Einstellungen">⚙️</button>
  </div>

  <div class="stats">
    <div class="stat"><span>Gesamt</span><b id="total">0</b></div>
    <div class="stat"><span>Verfügbar</span><b id="available">0</b></div>
    <div class="stat"><span>Verliehen</span><b id="loaned">0</b></div>
  </div>

  <div class="actions">
    <button class="action" onclick="openForm()">＋ Werkzeug</button>
    <button class="action light" onclick="scanQR()">▣ QR-Code</button>
  </div>

  <div class="searchbar">
    <input id="search" placeholder="Werkzeug suchen …" oninput="render()">
  </div>

  <div class="filters">
    <button class="filter active" onclick="setFilter('all',this)">Alle</button>
    <button class="filter" onclick="setFilter('available',this)">Verfügbar</button>
    <button class="filter" onclick="setFilter('loaned',this)">Verliehen</button>
  </div>

  <div id="list" class="list"></div>
</div>

<div class="bottom-nav">
  <div class="nav-inner">
    <button class="nav-item active" onclick="showHome(this)"><span class="nav-icon">⌂</span>Übersicht</button>
    <button class="nav-item" onclick="openForm();setNav(this)"><span class="nav-icon">＋</span>Hinzufügen</button>
    <button class="nav-item" onclick="openSettings();setNav(this)"><span class="nav-icon">⚙</span>Einstellungen</button>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
  <div class="sheet-head">
    <h2 id="modalTitle">Werkzeug</h2>
    <button class="close" onclick="closeModal()">✕</button>
  </div>

  <form id="form" onsubmit="saveTool(event)">
    <input type="hidden" id="editId">
    <div class="grid">
      <div><label>Inventarnummer *</label><input id="inventoryNo" required placeholder="z. B. WZ-0001"></div>
      <div><label>Bezeichnung *</label><input id="name" required></div>
      <div><label>Hersteller</label><input id="brand"></div>
      <div><label>Modell</label><input id="model"></div>
      <div><label>Seriennummer</label><input id="serial"></div>
      <div><label>Kategorie</label><input id="category" placeholder="z. B. Akkuwerkzeug"></div>
      <div><label>Standort</label><select id="location"></select></div>
      <div><label>Zustand</label><select id="condition"><option>Sehr gut</option><option>Gut</option><option>Gebraucht</option><option>Defekt</option></select></div>
      <div class="full"><label>Bemerkung</label><textarea id="note" rows="3"></textarea></div>
    </div>
    <div class="form-actions"><button class="primary" type="submit">Speichern</button><button class="secondary" type="button" onclick="closeModal()">Abbrechen</button></div>
  </form>

  <div id="detail" class="hidden"></div>

  <div id="settings" class="hidden">
    <div class="settings-section">
      <h3>Standorte</h3>
      <div class="muted">Diese Auswahl steht bei jedem Werkzeug zur Verfügung.</div>
      <div id="locationList" class="chips"></div>
      <div class="setting-row"><input id="newLocation" placeholder="Neuen Standort eingeben"><button onclick="addLocation()">＋</button></div>
    </div>
    <div class="settings-section">
      <h3>Datensicherung</h3>
      <div class="muted">Werkzeuge und Einstellungen als Datei sichern oder wiederherstellen.</div>
      <div class="form-actions">
        <button class="primary" onclick="exportBackup()">⬇ Sicherung</button>
        <button class="secondary" onclick="document.getElementById('backupFile').click()">⬆ Wiederherstellen</button>
      </div>
      <input id="backupFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(event)">
      <div id="backupStatus" class="muted" style="margin-top:9px"></div>
    </div>
  </div>
</div></div>

<script>
const TOOL_KEY='werkzeuge_v1';
const SETTINGS_KEY='werkzeuge_settings_v1';
let tools=JSON.parse(localStorage.getItem(TOOL_KEY)||'[]');
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null')||{locations:['Werkstatt','Lager','Firmenbus 1','Firmenbus 2']};

function persist(){localStorage.setItem(TOOL_KEY,JSON.stringify(tools));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
let currentFilter='all';
function setFilter(f,btn){
 currentFilter=f;
 document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
 if(btn)btn.classList.add('active');
 render();
}
function showHome(btn){closeModal();setNav(btn)}
function setNav(btn){document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}
function render(){
 const q=document.getElementById('search').value.toLowerCase(),f=currentFilter;
 let a=tools.filter(t=>(!q||[t.name,t.inventoryNo,t.brand,t.model,t.serial,t.category,t.location,t.loanedTo].join(' ').toLowerCase().includes(q))&&(f==='all'||(f==='loaned'?t.loanedTo:f==='available'&&!t.loanedTo)));
 document.getElementById('total').textContent=tools.length;
 document.getElementById('available').textContent=tools.filter(t=>!t.loanedTo).length;
 document.getElementById('loaned').textContent=tools.filter(t=>t.loanedTo).length;
 document.getElementById('list').innerHTML=a.length?a.map(t=>`
 <div class="tool-card" onclick="showTool('${t.id}')">
  <div class="tool-top">
   <div class="tool-avatar">🔧</div>
   <div class="tool-main">
    <div class="tool-name">${esc(t.inventoryNo||'–')} · ${esc(t.name)}</div>
    <div class="tool-meta">${esc([t.brand,t.model].filter(Boolean).join(' ')||'Keine Herstellerangabe')}</div>
   </div>
   <span class="status ${t.loanedTo?'out':'ok'}">${t.loanedTo?'Verliehen':'Verfügbar'}</span>
  </div>
  <div class="tool-bottom"><span>📍 ${esc(t.location||'Kein Standort')}</span><span>${t.loanedTo?'👤 '+esc(t.loanedTo):esc(t.condition||'')}</span></div>
 </div>`).join(''):'<div class="empty"><div style="font-size:30px;margin-bottom:8px">🔧</div><b>Keine Werkzeuge</b><div style="margin-top:5px">Füge dein erstes Werkzeug hinzu.</div></div>';
}
function fillLocations(selected=''){
 document.getElementById('location').innerHTML='<option value="">Kein Standort</option>'+settings.locations.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('');
}
function openForm(t=null){
 document.getElementById('modalTitle').textContent=t?'Werkzeug bearbeiten':'Werkzeug hinzufügen';
 document.getElementById('form').classList.remove('hidden');document.getElementById('detail').classList.add('hidden');document.getElementById('settings').classList.add('hidden');
 document.getElementById('editId').value=t?.id||'';document.getElementById('inventoryNo').value=t?.inventoryNo||'';document.getElementById('name').value=t?.name||'';
 ['brand','model','serial','category','note'].forEach(k=>document.getElementById(k).value=t?.[k]||'');
 document.getElementById('condition').value=t?.condition||'Sehr gut';fillLocations(t?.location||'');document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveTool(e){
 e.preventDefault();const id=document.getElementById('editId').value||crypto.randomUUID();let t=tools.find(x=>x.id===id)||{id,created:new Date().toISOString()};
 ['inventoryNo','name','brand','model','serial','category','note'].forEach(k=>t[k]=document.getElementById(k).value);
 t.location=document.getElementById('location').value;t.condition=document.getElementById('condition').value;
 if(!tools.find(x=>x.id===id))tools.push(t);persist();closeModal();
}
function showTool(id){
 const t=tools.find(x=>x.id===id);if(!t)return;
 document.getElementById('modalTitle').textContent=t.name;document.getElementById('form').classList.add('hidden');document.getElementById('settings').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');
 document.getElementById('detail').innerHTML=`<div class="detail-card"><b>Inventarnummer:</b> ${esc(t.inventoryNo)||'–'}<br><br>
 <span class="badge ${t.loanedTo?'out':''}">${t.loanedTo?'Verliehen':'Verfügbar'}</span>
 ${t.loanedTo?`<p>👤 <b>${esc(t.loanedTo)}</b><br><span class="muted">seit ${esc(t.loanedDate||'')}</span></p>`:''}
 <p>${esc(t.brand)} ${esc(t.model)}<br>Seriennummer: ${esc(t.serial)||'–'}<br>Kategorie: ${esc(t.category)||'–'}<br>Standort: ${esc(t.location)||'–'}<br>Zustand: ${esc(t.condition)||'–'}</p>
 ${t.note?`<p>📝 ${esc(t.note)}</p>`:''}
 <div class="row"><button onclick="editTool('${t.id}')">Bearbeiten</button>${t.loanedTo?`<button class="secondary" onclick="returnTool('${t.id}')">↩ Zurück</button>`:`<button onclick="loanTool('${t.id}')">👤 Verleihen</button>`}</div>
 <button class="danger" style="width:100%;margin-top:8px" onclick="deleteTool('${t.id}')">Werkzeug löschen</button></div>`;
 document.getElementById('modal').classList.add('open');
}
function editTool(id){openForm(tools.find(t=>t.id===id))}
function loanTool(id){const t=tools.find(x=>x.id===id),p=prompt('Verliehen an:');if(p&&p.trim()){t.loanedTo=p.trim();t.loanedDate=new Date().toLocaleDateString('de-AT');persist();closeModal()}}
function returnTool(id){const t=tools.find(x=>x.id===id);t.loanedTo='';t.loanedDate='';persist();closeModal()}
function deleteTool(id){if(confirm('Werkzeug wirklich löschen?')){tools=tools.filter(t=>t.id!==id);persist();closeModal()}}
function openSettings(){
 document.getElementById('modalTitle').textContent='Einstellungen';document.getElementById('form').classList.add('hidden');document.getElementById('detail').classList.add('hidden');document.getElementById('settings').classList.remove('hidden');renderLocations();document.getElementById('modal').classList.add('open');
}
function renderLocations(){document.getElementById('locationList').innerHTML=settings.locations.map((x,i)=>`<span class="location-chip">${esc(x)} <button style="padding:2px 5px;background:none;color:#3730a3" onclick="removeLocation(${i})">×</button></span>`).join('')||'<span class="muted">Noch keine Standorte.</span>'}
function addLocation(){const x=document.getElementById('newLocation').value.trim();if(x&&!settings.locations.includes(x)){settings.locations.push(x);document.getElementById('newLocation').value='';persist();renderLocations();fillLocations()}}
function removeLocation(i){if(confirm('Standort aus der Vorauswahl entfernen? Bereits gespeicherte Werkzeuge behalten ihren Standort.')){settings.locations.splice(i,1);persist();renderLocations()}}
function exportBackup(){
 const data={app:'Werkzeugverwaltung',version:3,exportedAt:new Date().toISOString(),tools,settings};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='werkzeugverwaltung-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);document.getElementById('backupStatus').textContent='Sicherung wurde erstellt.';
}
function importBackup(e){
 const file=e.target.files[0];if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const data=JSON.parse(r.result);if(data.app!=='Werkzeugverwaltung'||!Array.isArray(data.tools)||!data.settings||!Array.isArray(data.settings.locations))throw new Error();
 if(confirm('Aktuelle Daten durch die Sicherung ersetzen?')){tools=data.tools;settings=data.settings;persist();renderLocations();document.getElementById('backupStatus').textContent='Sicherung erfolgreich eingespielt.'}}catch(err){alert('Die Datei ist keine gültige Werkzeugverwaltung-Sicherung.')}};r.readAsText(file);e.target.value='';
}
function scanQR(){alert('Der echte QR-Scanner kommt als nächster Ausbauschritt. Die Inventarnummer ist bereits als eindeutige Kennung vorbereitet.')}
render();fillLocations();
</script>
</body>
</html>
