<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Werkzeugverwaltung</title>
<style>
:root{font-family:Arial,sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:18px}
header{background:#111827;color:white;padding:18px;border-radius:16px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:24px}.muted{color:#6b7280;font-size:13px}
header .muted{color:#d1d5db}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.card{background:white;border-radius:14px;padding:15px;box-shadow:0 1px 4px #0001}
.stat b{font-size:24px;display:block}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
button{border:0;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;cursor:pointer;background:#111827;color:white}
button.secondary{background:white;color:#111827;border:1px solid #d1d5db}
button.danger{background:#b91c1c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
label{font-size:13px;font-weight:600;display:block;margin:10px 0 5px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center}
.badge{padding:5px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}
.badge.out{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}.sheet{background:white;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.row{display:flex;gap:8px}.row>*{flex:1}
.hidden{display:none!important}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header><div class="row" style="align-items:center"><div style="flex:1"><h1>🔧 Werkzeugverwaltung</h1><div class="muted">Werkzeuge verwalten · verleihen · zurücknehmen</div></div><button class="secondary" style="flex:0 0 auto" onclick="openSettings()">⚙️</button></div></header>

<div class="stats">
<div class="card stat"><span class="muted">Gesamt</span><b id="total">0</b></div>
<div class="card stat"><span class="muted">Verfügbar</span><b id="available">0</b></div>
<div class="card stat"><span class="muted">Verliehen</span><b id="loaned">0</b></div>
</div>

<div class="actions">
<button onclick="openForm()">＋ Werkzeug hinzufügen</button>
<button onclick="scanQR()">📷 QR-Code scannen</button>
</div>

<div class="toolbar">
<input id="search" placeholder="Werkzeug suchen …" oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Alle</option><option value="available">Verfügbar</option><option value="loaned">Verliehen</option>
</select>
</div>

<div id="list"></div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<div class="row"><h2 id="modalTitle" style="margin-top:0;flex:1">Werkzeug</h2><button class="secondary" style="flex:0 0 auto" onclick="closeModal()">✕</button></div>
<form id="form" onsubmit="saveTool(event)">
<input type="hidden" id="editId">
<div class="grid">
<div><label>Inventarnummer *</label><input id="inventoryNo" required placeholder="z. B. WZ-0001"></div>
<div><label>Bezeichnung *</label><input id="name" required></div>
<div><label>Hersteller</label><input id="brand"></div>
<div><label>Modell</label><input id="model"></div>
<div><label>Seriennummer</label><input id="serial"></div>
<div><label>Kategorie</label><input id="category" placeholder="z. B. Akkuwerkzeug"></div>
<div><label>Standort</label><select id="location"></select></div>
<div><label>Zustand</label><select id="condition"><option>Sehr gut</option><option>Gut</option><option>Gebraucht</option><option>Defekt</option></select></div>
<div class="full"><label>Bemerkung</label><textarea id="note" rows="3"></textarea></div>
</div>
<div style="margin-top:14px" class="row"><button type="submit">Speichern</button><button type="button" class="secondary" onclick="closeModal()">Abbrechen</button></div>
</form>
<div id="detail" class="hidden"></div>
<div id="settings" class="hidden">
<h3>Standorte</h3><div class="muted">Diese Auswahl steht bei jedem Werkzeug zur Verfügung.</div>
<div id="locationList" style="display:flex;flex-wrap:wrap;gap:7px;margin:8px 0"></div>
<div class="row"><input id="newLocation" placeholder="Neuen Standort eingeben"><button onclick="addLocation()">＋ Hinzufügen</button></div>
<h3 style="margin-top:24px">Datensicherung</h3>
<div class="muted">Alle Werkzeuge und Einstellungen als Datei sichern oder später wieder einspielen.</div>
<div class="row" style="margin-top:10px"><button onclick="exportBackup()">⬇️ Sicherung erstellen</button><button class="secondary" onclick="document.getElementById('backupFile').click()">⬆️ Sicherung einspielen</button></div>
<input id="backupFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(event)">
<div id="backupStatus" class="muted" style="margin-top:10px"></div>
</div>
</div></div>

<script>
const TOOL_KEY='werkzeuge_v1', SETTINGS_KEY='werkzeuge_settings_v1';
let tools=JSON.parse(localStorage.getItem(TOOL_KEY)||'[]');
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null')||{locations:['Werkstatt','Lager','Firmenbus 1','Firmenbus 2']};
function persist(){localStorage.setItem(TOOL_KEY,JSON.stringify(tools));localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let a=tools.filter(t=>(!q||[t.name,t.inventoryNo,t.brand,t.model,t.serial,t.category,t.location,t.loanedTo].join(' ').toLowerCase().includes(q))&&(f==='all'||(f==='loaned'?t.loanedTo:f==='available'&&!t.loanedTo)));document.getElementById('total').textContent=tools.length;document.getElementById('available').textContent=tools.filter(t=>!t.loanedTo).length;document.getElementById('loaned').textContent=tools.filter(t=>t.loanedTo).length;document.getElementById('list').innerHTML=a.length?a.map(t=>`<div class="card" style="margin-bottom:9px" onclick="showTool('${t.id}')"><div class="item"><div><b>${esc(t.inventoryNo||'–')} · ${esc(t.name)}</b><div class="muted">${esc([t.brand,t.model].filter(Boolean).join(' '))}</div></div><span class="badge ${t.loanedTo?'out':''}">${t.loanedTo?'Verliehen':'Verfügbar'}</span></div><div class="muted" style="margin-top:7px">📍 ${esc(t.location||'Kein Standort')}${t.loanedTo?' · 👤 '+esc(t.loanedTo):''}</div></div>`).join(''):'<div class="card muted">Noch keine Werkzeuge angelegt.</div>'}
function fillLocations(sel=''){document.getElementById('location').innerHTML='<option value="">Kein Standort</option>'+settings.locations.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}
function openForm(t=null){document.getElementById('modalTitle').textContent=t?'Werkzeug bearbeiten':'Werkzeug hinzufügen';document.getElementById('form').classList.remove('hidden');document.getElementById('detail').classList.add('hidden');document.getElementById('settings').classList.add('hidden');document.getElementById('editId').value=t?.id||'';document.getElementById('inventoryNo').value=t?.inventoryNo||'';document.getElementById('name').value=t?.name||'';['brand','model','serial','category','note'].forEach(k=>document.getElementById(k).value=t?.[k]||'');document.getElementById('condition').value=t?.condition||'Sehr gut';fillLocations(t?.location||'');document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveTool(e){e.preventDefault();const id=document.getElementById('editId').value||crypto.randomUUID();let t=tools.find(x=>x.id===id)||{id,created:new Date().toISOString()};['inventoryNo','name','brand','model','serial','category','note'].forEach(k=>t[k]=document.getElementById(k).value);t.location=document.getElementById('location').value;t.condition=document.getElementById('condition').value;if(!tools.find(x=>x.id===id))tools.push(t);persist();closeModal()}
function showTool(id){const t=tools.find(x=>x.id===id);if(!t)return;document.getElementById('modalTitle').textContent=t.name;document.getElementById('form').classList.add('hidden');document.getElementById('settings').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');document.getElementById('detail').innerHTML=`<div class="card"><b>Inventarnummer:</b> ${esc(t.inventoryNo)||'–'}<br><br><span class="badge ${t.loanedTo?'out':''}">${t.loanedTo?'Verliehen':'Verfügbar'}</span>${t.loanedTo?`<p>👤 <b>${esc(t.loanedTo)}</b><br><span class="muted">seit ${esc(t.loanedDate||'')}</span></p>`:''}<p>${esc(t.brand)} ${esc(t.model)}<br>Seriennummer: ${esc(t.serial)||'–'}<br>Kategorie: ${esc(t.category)||'–'}<br>Standort: ${esc(t.location)||'–'}<br>Zustand: ${esc(t.condition)||'–'}</p>${t.note?`<p>📝 ${esc(t.note)}</p>`:''}<div class="row"><button onclick="editTool('${t.id}')">Bearbeiten</button>${t.loanedTo?`<button class="secondary" onclick="returnTool('${t.id}')">↩ Zurück</button>`:`<button onclick="loanTool('${t.id}')">👤 Verleihen</button>`}</div><button class="danger" style="width:100%;margin-top:8px" onclick="deleteTool('${t.id}')">Werkzeug löschen</button></div>`;document.getElementById('modal').classList.add('open')}
function editTool(id){openForm(tools.find(t=>t.id===id))}function loanTool(id){const t=tools.find(x=>x.id===id),p=prompt('Verliehen an:');if(p&&p.trim()){t.loanedTo=p.trim();t.loanedDate=new Date().toLocaleDateString('de-AT');persist();closeModal()}}function returnTool(id){const t=tools.find(x=>x.id===id);t.loanedTo='';t.loanedDate='';persist();closeModal()}function deleteTool(id){if(confirm('Werkzeug wirklich löschen?')){tools=tools.filter(t=>t.id!==id);persist();closeModal()}}
function openSettings(){document.getElementById('modalTitle').textContent='Einstellungen';document.getElementById('form').classList.add('hidden');document.getElementById('detail').classList.add('hidden');document.getElementById('settings').classList.remove('hidden');renderLocations();document.getElementById('modal').classList.add('open')}
function renderLocations(){document.getElementById('locationList').innerHTML=settings.locations.map((x,i)=>`<span style="background:#eef2ff;color:#3730a3;padding:7px 10px;border-radius:999px;font-size:13px">${esc(x)} <button style="padding:2px 5px;background:none;color:#3730a3" onclick="removeLocation(${i})">×</button></span>`).join('')||'<span class="muted">Noch keine Standorte.</span>'}
function addLocation(){const x=document.getElementById('newLocation').value.trim();if(x&&!settings.locations.includes(x)){settings.locations.push(x);document.getElementById('newLocation').value='';persist();renderLocations();fillLocations()}}
function removeLocation(i){if(confirm('Standort aus der Vorauswahl entfernen? Bereits gespeicherte Werkzeuge behalten ihren Standort.')){settings.locations.splice(i,1);persist();renderLocations()}}
function exportBackup(){const data={version:2,exportedAt:new Date().toISOString(),tools,settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='werkzeuginventur-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);document.getElementById('backupStatus').textContent='Sicherung wurde erstellt.'}
function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.tools)||!data.settings||!Array.isArray(data.settings.locations))throw new Error();if(confirm('Aktuelle Daten durch die Sicherung ersetzen?')){tools=data.tools;settings=data.settings;persist();renderLocations();document.getElementById('backupStatus').textContent='Sicherung erfolgreich eingespielt.'}}catch(err){alert('Die Datei ist keine gültige Werkzeuginventur-Sicherung.')}};r.readAsText(file);e.target.value=''}
function scanQR(){alert('Der echte QR-Scanner kommt als nächster Schritt. Die Inventarnummer ist bereits als eindeutige Kennung vorbereitet.')}
render();fillLocations();
</script>
</body>
</html>
